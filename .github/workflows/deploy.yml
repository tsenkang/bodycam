name: "Godot 4 Auto-Deploy para Web"
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar Código
        uses: actions/checkout@v4

      - name: Baixar e Configurar Godot 4 (Versão Correta)
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0  # Mantido na 4.3 para aceitar o TONE_MAPPER_AGX do seu jogo
          use-dotnet: false
          include-templates: true

      - name: Forçar Atualização do Cache de Classes da Godot
        run: |
          mkdir -p .godot
          godot --headless --editor --quit || true

      - name: Criar Pastas de Build
        run: mkdir -v -p build/web

      - name: Exportar Projeto para HTML5
        run: godot --headless --export-release "Web" build/web/index.html

      - name: Corrigir Erro de Segurança da Godot 4 (COOP/COEP para GitHub Pages)
        run: |
          curl -fsSL https://githubusercontent.com -o build/web/coi-serviceworker.js
          sed -i 's|<head>|<head><script src="coi-serviceworker.js"></script>|g' build/web/index.html

      - name: Publicar no GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
